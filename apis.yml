aid: kiva-systems-amazon-robotics-since-2012
name: Kiva Systems (Amazon Robotics since 2012)
description: 'Kiva Systems was a warehouse robotics company founded in 2003 that pioneered the goods-to-person
  mobile fulfillment model, in which fleets of low-profile drive units lift and carry mobile storage pods
  to human pick stations instead of moving workers to static shelving. Amazon acquired Kiva Systems in
  March 2012 for approximately US$775 million and renamed it Amazon Robotics in 2015. Since the acquisition
  the technology has been developed exclusively for Amazon''s own fulfillment and sortation network and
  is no longer sold to third parties. Amazon Robotics publishes no public API, developer portal or SDKs;
  amazonrobotics.com now redirects to Amazon''s internal identity provider and kivasystems.com no longer
  resolves. This profile is retained as a historical and acquisition record in the physical-AI and warehouse-robotics
  space rather than as an integratable API provider. Not to be confused with AWS RoboMaker or AWS IoT
  RoboRunner, which are AWS product APIs.'
